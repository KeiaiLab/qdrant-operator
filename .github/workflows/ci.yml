name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          # go.mod 의 go 지시자는 "최소 요구 버전"이지 빌드 핀이 아니다. minor 라인을
          # 직접 적고 check-latest 로 최신 패치를 받는다 — Dockerfile 의 golang:1.26 과
          # 같은 stdlib 를 검증하기 위해서다(2026-09-10: 낡은 toolchain 핀 때문에 CI 가
          # 1.26.5 로 돌아 stdlib 권고 6건에 2주간 빨간불이었다).
          go-version: '1.26'
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: latest
          args: --timeout=10m
          # Enforce across the whole file, not just the PR diff, so
          # pre-existing regressions also block the PR.
          only-new-issues: false

  docs:
    name: doc drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check documentation against implementation
        run: make doc-drift

  test:
    name: unit + envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Run tests
        run: make test
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: ./cover.out
          fail_ci_if_error: false

  build:
    name: build manager binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - run: make build
