name: kube-linter

# Static analysis of rendered Helm manifests. Catches security and
# operational antipatterns (privileged containers, missing resource
# limits, `latest` tag, missing read-only-rootfs, etc.) before they
# reach a cluster.
#
# Pairs with:
# - helm-lint.yml      (chart structural validation)
# - codeql.yml         (Go SAST)
# - security-scan.yml  (image CVE scan)

on:
  # Run on every PR so the job functions as a `required_status_check`
  # context. Paths-filtered required checks stay pending forever on
  # PRs that don't touch the filtered paths, which blocks otherwise
  # legitimate merges.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '53 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-chart:
    name: kube-linter (helm chart render)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with: { version: v4.3.0 }

      - name: Render helm chart with default values
        run: |
          mkdir -p /tmp/rendered
          helm template qdrant-operator deploy/chart \
            --namespace qdrant-operator-system \
            > /tmp/rendered/default.yaml

      - uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: /tmp/rendered
          config: .github/kube-linter-config.yaml
          format: sarif
          output-file: kube-linter.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: kube-linter.sarif
          category: kube-linter-helm
