# This rule is not used by the project qdrant-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to qdrant.keiailab.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: qdrant-operator
    app.kubernetes.io/managed-by: kustomize
  name: qdrantrestore-viewer-role
rules:
- apiGroups:
  - qdrant.keiailab.com
  resources:
  - qdrantrestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - qdrant.keiailab.com
  resources:
  - qdrantrestores/status
  verbs:
  - get
